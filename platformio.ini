; SortVision arm robot firmware — ESP32, Opsi A (no Jetson Nano).
; Subscribes to "<base_topic>/command" (MQTT) and drives 5x stepper (NEMA17
; via A4988/DRV8825) + 1x servo gripper, publishing telemetry back on
; "<base_topic>/status". See README.md for wiring and configuration.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The production MQTT robot firmware is the default build.
; PlatformIO otherwise compiles every source in src/, including the standalone
; Modbus test sketch, which would create a second setup()/loop() pair.
build_src_filter =
    +<*>
    -<Modbus_slave_test.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Build the standalone MAX485 Modbus RTU slave test with:
;   pio run -e modbus_test
; Upload it with:
;   pio run -e modbus_test -t upload
[env:modbus_test]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<Modbus_slave_test.cpp>
