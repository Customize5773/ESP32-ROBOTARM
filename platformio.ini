; SortVision arm robot firmware — ESP32, Opsi A (no Jetson Nano).
; Subscribes to "<base_topic>/command" (MQTT) and drives 5x stepper (NEMA17
; via A4988/DRV8825) + 1x servo gripper, publishing telemetry back on
; "<base_topic>/status". See README.md for wiring and configuration.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    waspinator/AccelStepper@^1.64
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D CORE_DEBUG_LEVEL=1
